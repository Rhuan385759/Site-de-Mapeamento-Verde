function NumeroAnimado(props) {
  var referencia = React.useRef(null);
  var estado = React.useState(0);
  var valorAtual = estado[0];
  var mudarValorAtual = estado[1];

  React.useEffect(function () {
    function animar() {
      var duracaoEmMilissegundos = 700;
      var momentoInicial = performance.now();

      function atualizarQuadro(momentoAtual) {
        var tempoDecorrido = momentoAtual - momentoInicial;
        var progresso = Math.min(tempoDecorrido / duracaoEmMilissegundos, 1);
        var progressoSuavizado = 1 - Math.pow(1 - progresso, 3);

        mudarValorAtual(Math.round(props.valorFinal * progressoSuavizado));

        if (progresso < 1) {
          requestAnimationFrame(atualizarQuadro);
        }
      }

      requestAnimationFrame(atualizarQuadro);
    }

    var observador = new IntersectionObserver(function (listaDeEventos) {
      if (listaDeEventos[0].isIntersecting) {
        observador.disconnect();
        animar();
      }
    }, { threshold: 0.6 });

    observador.observe(referencia.current);

    return function () {
      observador.disconnect();
    };
  }, []);

  return (
    <div ref={referencia} className={props.className} style={props.estilo}>
      {valorAtual}
    </div>
  );
}

        <Alert variant="success">
          As Estações de Coleta do Semasa <strong className="text-danger">não recebem pilhas nem baterias</strong> — esse material tem um posto próprio (Green Eletron), listado abaixo.
        </Alert>

        <Accordion defaultActiveKey="vila-linda">
          {pontosDeColeta.map(function (ponto) {
            return (
              <Accordion.Item eventKey={ponto.id} key={ponto.id}>
                <Accordion.Header>
                  {ponto.nome}
                  {ponto.selos.map(function (selo) {
                    return (
                      <span key={selo.texto} className={"badge ms-2 " + selo.classe}>{selo.texto}</span>
                    );
                  })}
                </Accordion.Header>
                <Accordion.Body>
                  <p className="mb-1"><strong>Endereço:</strong> {ponto.endereco}</p>
                  <p className="mb-1 text-secondary small"><strong>Horário:</strong> {ponto.horario}</p>
                  <p className="mb-3 small">{ponto.observacao}</p>
                  <Button href={ponto.link} target="_blank" rel="noopener" variant="success" size="sm">Ver no mapa →</Button>
                </Accordion.Body>
              </Accordion.Item>
            );
          })}
        </Accordion>

        <p className="text-secondary small mt-4">Endereços e horários: Semasa / Prefeitura de Santo André. Posto de pilhas e baterias: programa Green Eletron. Lista de pilhas sujeita a atualização — confirme no site da Green Eletron antes de imprimir o material.</p>

      </Container>
    </section>
  );
}

function ModalCreditos(props) {
  return (
    <Modal show={props.aberto} onHide={props.aoFechar} centered>
      <Modal.Header closeButton>
        <Modal.Title className="fw-bold text-success-emphasis">Créditos</Modal.Title>
      </Modal.Header>

      <Modal.Body>
        <p className="text-secondary small mb-1">Instituição de ensino</p>
        <p className="fw-bold mb-3">Escola Senai Armando de Arruda Pereira</p>

        <p className="text-secondary small mb-1">Desenvolvedores do projeto</p>
        <ul className="list-unstyled mb-0">
          {desenvolvedores.map(function (nome) {
            return <li key={nome}>{nome}</li>;
          })}
        </ul>
      </Modal.Body>

      <Modal.Footer>
        <Button variant="success" onClick={props.aoFechar}>Fechar</Button>
      </Modal.Footer>
    </Modal>
  );
}

function Rodape() {
  var estado = React.useState(false);
  var creditosAbertos = estado[0];
  var mudarCreditosAbertos = estado[1];

  function abrirCreditos() {
    mudarCreditosAbertos(true);
  }

  function fecharCreditos() {
    mudarCreditosAbertos(false);
  }

  return (
    <footer className="text-light py-5" style={{ backgroundColor: "var(--cor-verde-escuro)" }}>
      <Container>
        <Row className="g-4 mb-4">

          <Col md={7}>
            <h4 className="h6 fw-bold">Mapa Verde Santo André</h4>
            <p className="small text-white-50">Mapeamento de pontos de coleta seletiva, pilhas, eletrônicos e óleo de cozinha na Vila Bela Vista, Santo André, em parceria com a E.E. Padre Louis Joseph Lebret.</p>
          </Col>

          <Col md={5}>
            <h4 className="h6 fw-bold">Fontes oficiais</h4>
            <ul className="list-unstyled small">
              <li><a className="link-light" href="https://portais.santoandre.sp.gov.br/semasa/residuos/estacoes-de-coleta/" target="_blank" rel="noopener">Semasa — Estações de Coleta</a></li>
              <li><a className="link-light" href="https://portais.santoandre.sp.gov.br/semasa/residuos/residuos-perigosos-e-outros/pilhas-e-baterias/" target="_blank" rel="noopener">Semasa — Pilhas e baterias</a></li>
            </ul>
          </Col>

        </Row>

        <div className="d-flex flex-wrap gap-2 border-top border-light border-opacity-25 pt-4">
          <Button variant="outline-light" size="sm" onClick={abrirCreditos}>Créditos</Button>
          <Button variant="warning" size="sm" href="https://forms.gle/AGrYZTCqumhZgrxK9" target="_blank" rel="noopener">Feedback</Button>
        </div>

      </Container>

      <ModalCreditos aberto={creditosAbertos} aoFechar={fecharCreditos} />
    </footer>
  );
}

function App() {
  return (
    <div>
      <Navegacao />
      <main>
        <SecaoPrincipal />
        <FaixaNumeros />
        <SobreProjeto />
        <SecaoVideo />
        <EscolaParceira />
        <ComoEncontrar />
        <PontosDeColeta />
      </main>
      <Rodape />
    </div>
  );
}

var raiz = ReactDOM.createRoot(document.getElementById("raiz"));
raiz.render(<App />);

</script>

</body>
</html>
